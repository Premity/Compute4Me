# Local dev topology (the "dev" side of ADR-0021): Master + Workers on one host, built from
# this checkout as ghcr.io/premity/compute4me:dev. Not for real deployments; those use the
# released image and docs/architecture/deployment.md.
#
# Not runnable yet: `serve` and `worker` raise "not implemented" until T31. T31 reworks this
# file (one Master, one CPU Worker under a `worker` profile, C4M_BENCHMARK=skip, the Docker
# socket, init: true) and adds `make up`/`down`/`logs`/`smoke`.

services:
  master:
    build: .
    command: ["serve", "--room", "dev"]
    ports:
      - "8443:8443"
    volumes:
      - master-data:/data

  # Worker placeholders. T31 replaces them with one Worker that gets C4M_MASTER and
  # C4M_TOKEN (issued by `make token`) and the host Docker socket.
  worker-1:
    build: .
    command: ["worker"]
    depends_on:
      - master

  worker-2:
    build: .
    command: ["worker"]
    depends_on:
      - master

volumes:
  master-data:
