[project]
name = "compute4me"
version = "0.1.0"
description = "Docker-native, master-orchestrated distributed deep-learning fabric for heterogeneous, firewall-constrained machines."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Mohammad Hamd Ashfaque", email = "hamd.ashfaque@gmail.com" }]
dependencies = [
    # Validation boundaries (wire models, config) — see docs/style-guide.md §Data classes.
    "pydantic>=2.0",
    # Control channel: WebSocket server (Master) + client (Worker). See ADR-0007.
    "websockets>=14.0",
    # Artifact channel: HTTP serve + ingest. See ADR-0012.
    "starlette>=0.40",
    "uvicorn>=0.32",
    "httpx>=0.27",
    # Invite Tokens: JWT sign/verify. See ADR-0002.
    "pyjwt>=2.9",
    "cryptography>=43.0",
    # Capability profiling: CPU/RAM/disk probes. See T09.
    "psutil>=6.0",
    # Search-space sampling. See ADR-0010.
    "optuna>=4.0",
    # CLI + terminal rendering (unicode / --ascii / --slop). See ADR-0013.
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
compute4me = "compute4me.cli:app"

[project.urls]
Homepage = "https://github.com/Premity/Compute4Me"
Repository = "https://github.com/Premity/Compute4Me"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute4me"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle. I: import order (stdlib → third-party → local).
# UP: pyupgrade. B: bugbear. SIM: simplify. RUF: ruff-specific.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
# Third-party libs without type stubs (optuna, psutil) — don't fail on their imports.
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure, fast, no I/O",
    "integration: multi-module with fakes; no real network / GPU / Docker",
    "requires_docker: needs real Docker (skipped in CI)",
    "requires_gpu: needs CUDA (skipped in CI)",
    "task(id): attributes the test to one or more T-tasks",
    "slow: takes >5s",
]
